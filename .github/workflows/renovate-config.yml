name: Renovate config

# `renovate.json` is read by Renovate and by nothing else. No ESLint rule, no
# `tsc`, no CI job and no schema check in this repository ever parsed it — the
# `$schema` line at its top is honoured by editors, not by any gate. So the
# file's first reader was the Renovate app itself, in W5, six days after it was
# written: it rejected the config, opened "Action Required: Fix Renovate
# Configuration" and stopped EVERY PR, dependency dashboard included
# (`.debug/016` §4). A broken Renovate config does not look broken; it looks
# like a quiet week.
#
# `renovate-config-validator` ships inside the `renovate` package and reads the
# file with Renovate's own schema — as a REPOSITORY config, which is the schema
# the service applies, and only because `scripts/ci/renovate-config.sh` passes
# `--no-global`. Handed a filename the validator defaults to the self-hosted
# GLOBAL schema, which is wider: `baseDir` and `redisUrl` pass as a global
# config and are rejected in a repository one. Its own workflow rather than a
# job of ci.yml, for two reasons:
#
#   - The install pulls the whole of Renovate — minutes on a cold npx cache —
#     for a file that changes a few times a year. `paths:` keeps it off every
#     other PR.
#   - `paths:` is only safe OUTSIDE ci.yml. Every ci.yml job runs on every pull
#     request because a required context that does not report blocks the merge
#     for ever, and a skipped MATRIX job reports the literal
#     `e2e (${{ matrix.project }})` instead of its five names (`.debug/016` §2,
#     PR #8). This job is path-filtered, therefore it must never be required.
#
# The job's `name:` is the status context, `renovate-config-validator`, listed
# in NON_BLOCKING_CONTEXTS (tests/unit/ci/required-checks.test.ts).

on:
  pull_request:
    paths:
      - renovate.json
  push:
    branches: [main]
    paths:
      - renovate.json

concurrency:
  group: renovate-config-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  renovate-config-validator:
    name: renovate-config-validator
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      # No `npm ci`: the validator is not a dependency of this project and must
      # not become one — it is the whole of Renovate, ~350 MB, for a file that
      # changes a few times a year. The script downloads it with
      # `npx --yes --package renovate@<RENOVATE_VERSION>`: pinned, never
      # `@latest`, because a package fetched outside package-lock.json is a
      # package `audit-ci` never sees and the 7-day hold never held.
      - run: bash scripts/ci/renovate-config.sh
