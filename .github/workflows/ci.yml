name: CI

# Every job body is `npm ci` + `bash scripts/ci/<step>.sh`, and nothing else.
# That is not a style rule: it is what makes `npm run ci:local` (scripts/ci.sh)
# a real mirror of this pipeline. The moment a step is inlined here, the local
# hook and CI start to drift and the pre-push gate stops being trustworthy.
#
# The one exception is the single `jq` line in the `coverage` job, which turns
# coverage-summary.json into the job summary table — a GitHub-only concern with
# no local equivalent.
#
# Job `name:` values are branch-protection contexts. `tests/unit/ci/required-
# checks.test.ts` parses this file and codeql.yml and asserts the exact set, so
# renaming a job here is a test failure, not a silently unprotected branch.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"
  # CI-only values, identical to the committed .env.test. Nothing here is a
  # credential (.gitleaks.toml allowlists the `ci-only` / `ci-dummy` shapes).
  AUTH_SECRET: ci-only-secret-32-chars-minimum-abcdef
  AUTH_TRUST_HOST: "true"
  AUTH_GOOGLE_ID: ci-dummy
  AUTH_GOOGLE_SECRET: ci-dummy
  NEXT_PUBLIC_SITE_URL: http://localhost:3100
  BCRYPT_COST: "4"

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    # dorny/paths-filter calls the PR list-files API on pull_request events;
    # without pull-requests: read it fails with "Resource not accessible by
    # integration" and every downstream job is skipped.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      content: ${{ steps.filter.outputs.content }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            code:
              - 'app/**'
              - 'lib/**'
              - 'components/**'
              - 'content/**'
              - 'messages/**'
              - 'styles/**'
              - 'types/**'
              - 'assets/**'
              - 'prisma/**'
              - 'prisma.config.ts'
              - 'public/**'
              - 'tests/**'
              - 'scripts/**'
              - 'auth.ts'
              - 'auth.config.ts'
              - 'proxy.ts'
              - 'next.config.ts'
              - 'content-collections.ts'
              - 'global.d.ts'
              - 'components.json'
              - 'tsconfig.json'
              - '.nvmrc'
              - 'package.json'
              - 'package-lock.json'
              - 'vitest.config.ts'
              - 'playwright.config.ts'
              - 'lighthouserc.cjs'
              - 'perf.budgets.json'
              - 'eslint.config.mjs'
              - '.gitleaks.toml'
              - 'docker/**'
              - 'docker-compose.yml'
            content:
              - 'content/**'
              - 'messages/**'
              - 'scripts/content-check.ts'
              - 'content-collections.ts'
            workflows:
              - '.github/workflows/**'
          # No `screenshots` filter: a baseline change is label-checked by the
          # path-filtered visual-baseline-guard.yml workflow, not by a job here.

  nvmrc:
    name: nvmrc-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: bash scripts/ci/nvmrc.sh

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflows == 'true' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund --prefer-offline
      - run: bash scripts/ci/lint.sh

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Restore tsbuildinfo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: tsconfig.tsbuildinfo
          key: tsbuild-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            tsbuild-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json') }}-
      - run: npm ci --no-audit --no-fund --prefer-offline
      - run: bash scripts/ci/typecheck.sh

  content:
    name: content
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.content == 'true' || needs.changes.outputs.code == 'true' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund --prefer-offline
      - run: bash scripts/ci/content.sh

  unit:
    name: unit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund --prefer-offline
      - run: bash scripts/ci/test-unit.sh
      # `include-hidden-files: true` on every upload below whose path starts with a
      # dot: upload-artifact v4 skips dotfiles by default, so `.vitest-reports/`,
      # `.next` and `.lighthouseci/` silently uploaded NOTHING (a warning, not an
      # error) and every downstream job died on "Artifact not found". `if-no-files-
      # found: error` makes a future empty artifact fail here instead of there.
      - name: Upload unit blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blob-unit
          path: .vitest-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  integration:
    name: integration
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.ref == 'refs/heads/main'
    env:
      POSTGRES_URL: postgresql://velo:velo@localhost:5432/velo_atelier_test
      POSTGRES_URL_NON_POOLING: postgresql://velo:velo@localhost:5432/velo_atelier_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: velo
          POSTGRES_PASSWORD: velo
          POSTGRES_DB: velo_atelier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U velo -d velo_atelier_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund --prefer-offline
      - run: bash scripts/ci/test-integration.sh
      - name: Upload integration blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blob-integration
          path: .vitest-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  coverage:
    name: coverage (80%)
    runs-on: ubuntu-latest
    needs: [changes, unit, integration]
    # `!cancelled()` and not `always()`: a failing test tier must make THIS job
    # fail (coverage.sh refuses to report a verdict when a tier is red) rather
    # than skip, so the required check is red instead of green-by-absence.
    if: ${{ !cancelled() && (needs.changes.outputs.code == 'true' || github.ref == 'refs/heads/main') }}
    env:
      UNIT_RESULT: ${{ needs.unit.result }}
      INTEGRATION_RESULT: ${{ needs.integration.result }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Download blob reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: blob-*
          path: .vitest-reports/
          merge-multiple: true
      - run: npm ci --no-audit --no-fund --prefer-offline
      - run: bash scripts/ci/coverage.sh
      - run: jq -r '.total | "| metric | % |\n| --- | --- |\n| lines | \(.lines.pct) |\n| branches | \(.branches.pct) |\n| functions | \(.functions.pct) |\n| statements | \(.statements.pct) |"' coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  build:
    name: build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.ref == 'refs/heads/main'
    env:
      ENABLE_TEST_PAGES: "1"
      NEXT_PUBLIC_TEST_HOOKS: "1"
      NEXT_PUBLIC_DEMO_LOGIN: "1"
      # Inlined at build time: canonical, hreflang and og:url are prerendered from it.
      # This artifact is served on :3100 by the e2e and lighthouse jobs; any other
      # origin makes Lighthouse's canonical audit fail (.debug/003).
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      POSTGRES_URL: postgresql://velo:velo@localhost:5432/velo_atelier_test
      POSTGRES_URL_NON_POOLING: postgresql://velo:velo@localhost:5432/velo_atelier_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: velo
          POSTGRES_PASSWORD: velo
          POSTGRES_DB: velo_atelier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U velo -d velo_atelier_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Restore Next.js cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'lib/**', 'components/**', 'content/**', 'next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm ci --no-audit --no-fund --prefer-offline
      - run: bash scripts/ci/build.sh
      - name: Upload build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: next-build
          path: |
            .next
            !.next/cache
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  e2e:
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true' || github.ref == 'refs/heads/main'
    # Pinned to the same version as @playwright/test in package.json; renovate's
    # customManager bumps the image and the package together.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        project:
          - desktop-chromium
          - mobile-chromium
          - mobile-landscape
          - mobile-narrow
          - no-webgl
          - mobile-webkit
        include:
          # The one leg allowed to fail without blocking: see continue-on-error.
          - project: mobile-webkit
            optional: true
    # mobile-webkit only (`optional` above). It runs every spec but @snapshot and
    # @perf: layout, taps, and the 3D viewer, whose WebGL renders here without a
    # GPU (its @webgl specs run and pass). The no-WebGL fallback is the no-webgl
    # leg's, and the CDP touch gestures are Chromium-only. Why it stays
    # non-blocking even green: Linux WebKit is not the iOS Safari the plan's
    # phones run (another WebGL, compositor and input stack), so a WebKit-only
    # failure is a finding to read, not a merge veto (§7.2). Its one deterministic
    # failure was the test's own `mouse.wheel`, which mobile WebKit refuses
    # (.debug/015); a failure here is still read, never shrugged off.
    continue-on-error: ${{ matrix.optional == true }}
    env:
      PLAYWRIGHT_PROJECT: ${{ matrix.project }}
      POSTGRES_URL: postgresql://velo:velo@postgres:5432/velo_atelier_test
      POSTGRES_URL_NON_POOLING: postgresql://velo:velo@postgres:5432/velo_atelier_test
      ENABLE_TEST_PAGES: "1"
      NEXT_PUBLIC_TEST_HOOKS: "1"
      NEXT_PUBLIC_DEMO_LOGIN: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: velo
          POSTGRES_PASSWORD: velo
          POSTGRES_DB: velo_atelier_test
        options: >-
          --health-cmd "pg_isready -U velo -d velo_atelier_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Download build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: next-build
          path: .next
      - run: npm ci --no-audit --no-fund --prefer-offline
      - run: bash scripts/ci/e2e.sh
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true' || github.ref == 'refs/heads/main'
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      POSTGRES_URL: postgresql://velo:velo@postgres:5432/velo_atelier_test
      POSTGRES_URL_NON_POOLING: postgresql://velo:velo@postgres:5432/velo_atelier_test
      ENABLE_TEST_PAGES: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: velo
          POSTGRES_PASSWORD: velo
          POSTGRES_DB: velo_atelier_test
        options: >-
          --health-cmd "pg_isready -U velo -d velo_atelier_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Download build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: next-build
          path: .next
      - run: npm ci --no-audit --no-fund --prefer-offline
      - run: bash scripts/ci/lighthouse.sh
      - name: Upload Lighthouse results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lighthouse
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 14

  perf:
    name: perf
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true' || github.ref == 'refs/heads/main'
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      POSTGRES_URL: postgresql://velo:velo@postgres:5432/velo_atelier_test
      POSTGRES_URL_NON_POOLING: postgresql://velo:velo@postgres:5432/velo_atelier_test
      ENABLE_TEST_PAGES: "1"
      NEXT_PUBLIC_TEST_HOOKS: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: velo
          POSTGRES_PASSWORD: velo
          POSTGRES_DB: velo_atelier_test
        options: >-
          --health-cmd "pg_isready -U velo -d velo_atelier_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Download build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: next-build
          path: .next
      - run: npm ci --no-audit --no-fund --prefer-offline
      - run: bash scripts/ci/perf.sh
      - name: Upload perf results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf
          path: |
            .perf/
            test-results/
          include-hidden-files: true
          retention-days: 90

  gitleaks:
    name: secrets scan (gitleaks)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The whole history: a secret is a secret in any commit, and rewriting
          # history is the only real fix.
          fetch-depth: 0
      # gitleaks/gitleaks-action@v2 became licence-gated for organisations, so
      # scripts/ci/secrets.sh installs the pinned CLI (8.21.2) itself when CI=true.
      - run: bash scripts/ci/secrets.sh

  audit:
    name: npm audit (audit-ci)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund --prefer-offline
      - run: bash scripts/ci/audit.sh

  semgrep:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.ref == 'refs/heads/main'
    # Not the semgrep/semgrep container: it is Alpine-based with no bash, and
    # every job body here has to be `bash scripts/ci/<step>.sh`. The script
    # installs semgrep (pipx) when it is missing and CI=true.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Restore semgrep cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.semgrep
          key: semgrep-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            semgrep-${{ runner.os }}-
      - run: bash scripts/ci/sast.sh

  trivy:
    name: trivy fs scan
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Restore trivy DB cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/trivy
          key: trivy-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-${{ runner.os }}-
      - run: bash scripts/ci/trivy.sh
