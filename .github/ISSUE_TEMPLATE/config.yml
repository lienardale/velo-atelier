# Blank issues are disabled: the three templates cover everything this project
# can act on, and a bug report without a browser or a guide report without a
# bike costs a round trip that usually never comes back.
blank_issues_enabled: false
contact_links:
  - name: 🔒 Security vulnerability
    url: https://github.com/lienardale/velo-atelier/security/advisories/new
    about: Report it privately. Never in a public issue.
  - name: 💬 Question about repairing your bike
    url: https://github.com/lienardale/velo-atelier/discussions
    about: >
      Ask here rather than in an issue. If the answer should have been in a
      guide, we turn it into one.
